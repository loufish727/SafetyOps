project_id = "safetyops"

[auth]
site_url = "https://loufish727.github.io/SafetyOps/"
additional_redirect_urls = ["https://loufish727.github.io/SafetyOps/"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8
# Hosted Auth cannot express uppercase + special-character-only requirements
# without adding lowercase and digit requirements. The app enforces that exact
# creation/reset rule; hosted Auth enforces the length floor and HIBP screening.
password_requirements = ""

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[functions.sign-form-file]
verify_jwt = true

[functions.drive-safety-ingest]
# This non-browser service endpoint authenticates with a separate constant-time
# import secret and never accepts user JWTs. The function rejects Origin-bearing
# requests and validates every manifest/object before commit.
verify_jwt = false
