name: Verify and deploy Taylor Safe

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taylor-safe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run responsive application tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify public-data boundary and local approval attestation
        if: github.event_name != 'pull_request' && (github.repository == 'loufish727/SafetyOps' || vars.TAYLOR_SAFE_PAGES_ENABLED == 'true')
        run: npm run test:public-boundary:ci

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.repository == 'loufish727/SafetyOps' || vars.TAYLOR_SAFE_PAGES_ENABLED == 'true')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.repository == 'loufish727/SafetyOps' || vars.TAYLOR_SAFE_PAGES_ENABLED == 'true')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
