<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10231f">
    <meta
      name="description"
      content="Taylor Safe brings multi-location safety programs, training, inspections, incidents, documents, and regulatory traceability into one workspace."
    >
    <meta name="application-name" content="Taylor Safe">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    >
    <title>Taylor Safe · Safety management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <div id="reference-panel-region"></div>
    <dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-heading" aria-describedby="feedback-hint">
      <form id="feedback-form">
        <header>
          <h2 id="feedback-heading">Send feedback</h2>
          <p id="feedback-hint">Your app feedback, work email, and screen name go to the app owner.</p>
        </header>
        <div class="field">
          <label for="feedback-message">Your feedback</label>
          <textarea id="feedback-message" name="message" rows="5" maxlength="2000" required autofocus></textarea>
        </div>
        <p id="feedback-error" class="feedback-error" role="alert"></p>
        <div class="feedback-actions">
          <button class="button" type="button" data-action="cancel-feedback">Cancel</button>
          <button class="button primary" type="submit">Send feedback</button>
        </div>
      </form>
    </dialog>

    <script src="vendor/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="data.js"></script>
    <script src="osha-reference.js"></script>
    <script src="state-osha-reference.js"></script>
    <script src="safety-programs.js"></script>
    <script src="safety-source-lineage.js"></script>
    <script src="safety-program-extracts.js"></script>
    <script src="tenant-bootstrap.js"></script>
    <script src="app.js"></script>
  </body>
</html>
